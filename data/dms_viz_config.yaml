# Configuration for `configure-dms-viz`, keyed by names given to output JSONs
# See https://dms-viz.github.io/dms-viz-docs/preparing-data/command-line-api/
# for more on `configure-dms-viz`.

#---------------------------------------------------------------------------------------
# Structurs 6U7H 8WDE
#---------------------------------------------------------------------------------------
# 6U7H

cell_entry_on_s_6U7H:
  pdb_id: 6U7H
  name: spike 229E mutations effects on cell entry 
  pdb_type: biological_assembly
  data_csv: results/summaries/summary_of_all_phenotypes.csv
  sitemap_csv: data/dms-viz-sitemap.csv
  melt_condition_metric_cols: null
  metric: cell entry # metric to plot, in `data_csv` or created by `melt_conditions_metric_cols`
  opt_params: &cell_entry_opt_params
    included-chains: A B C
    alphabet: RKHDEQNSTYWFAILMVGPC
    floor: False
    summary-stat: mean
    tooltip-cols: {sequential_site: sequential site, region: region}
    heatmap-limits: "-5, 0, 2"

receptor_binding_on_s_6U7H:
  pdb_id: 6U7H
  name: spike 229E mutations effects hAPN receptor binding
  pdb_type: biological_assembly
  data_csv: results/summaries/summary_of_all_phenotypes.csv
  sitemap_csv: data/dms-viz-sitemap.csv
  melt_condition_metric_cols: null
  metric: receptor binding  # metric to plot, in `data_csv` or created by `melt_conditions_metric_cols`
  opt_params: 
    <<: *cell_entry_opt_params
    alphabet: RKHDEQNSTYWFAILMVGPC
    floor: False
    summary-stat: sum
    heatmap-limits: "-40, 0, 40"
    

antibody_escape_on_s_6U7H:
  pdb_id: 6U7H
  name: spike 229E mutations effects on human resistnat sera escape
  pdb_type: biological_assembly
  data_csv: results/summaries/summary_of_all_phenotypes.csv
  sitemap_csv: data/dms-viz-sitemap.csv
  melt_condition_metric_cols: null
  metric: human resistant sera escape
  opt_params: &escape_opt_params
    included-chains: A B C
    alphabet: RKHDEQNSTYWFAILMVGPC
    floor: False
    summary-stat: sum
    tooltip-cols: {cell entry: cell entry, sequential_site: sequential site, region: region}
    filter-cols: {cell entry: cell entry}
    filter-limits: {cell entry: [-4, -2.5, 0]}
    heatmap-limits: "-2.5, 0, 2"
